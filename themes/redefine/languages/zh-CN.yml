# ----------------------------------------
# 菜单翻译
#
# ⚠️ 这一段的值**刻意写成英文**，不是忘了翻译。
#    导航栏的显示文字有两套来源，容易打架：
#      · 普通导航项走 _config.yml 里的 text 字段，本站全填英文（Home / Archives / …）
#      · 下拉子菜单走这里的翻译（navbar.ejs 里 __(submenu.toLowerCase())）
#    原来这段是中文，于是下拉里出现「GALLERY / 说说 / 书签」这种中英混排。
#    整段改成英文后，两套来源统一，以后再加任何子菜单也不会混排。
#
#    影响面很小：这些 key 只在两处兜底用到 ——
#      1. getPageTitle：page.title || __(type)，本站每个页面都写了 title，走不到
#      2. 首页侧边栏：__(i) 兜底，但 sidebar.links 每项都有 text，也走不到
# ----------------------------------------
home: Home
archive: Archive
archives: Archives
about: About
links: Links
link: Link
friends: Friends
friend: Friend
timeline: Timeline
shuoshuo: Moments
bookmarks: Bookmarks
gallery: Gallery
# 下面两条在文件开头「网站翻译」段已有中文值（分类 / 标签）。
# 这里同名重复声明，YAML 以后出现的为准 —— 于是导航栏下拉取到英文，
# 而标签页标题用的是**单数** category / tag，仍是中文。别删这两行。
categories: Categories
tags: Tags

