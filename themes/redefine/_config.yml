      - "兄弟，我有点紧张，但作为地球之光，我必须勇敢。——张鹏"
      - "真遗憾，不能一起去贝加尔湖钓鲑鱼了。"
      - "我们还没转正，没有医疗保险。——赫伯特·科普利"
      - "我知道，我用不到了。——刘培强"
      - "五颗核弹用不了两个人，就仨座儿，坐不下了，回家吧，你女儿在家里等着你呢。"
      - "别看了，只剩一套潜水服，这里的工作完不成，都得死。——马兆"
      - "我希望世界记住这一天。"
      - "有人在帮我们。"
      - "键盘就是你的武器。"
      - "带鱼睡觉的时候，是竖着的。——马兆"
      - "东西终于便宜了。——图恒宇"
      - "笨笨，别怕，我在呢。"
      - "这是世界上最大的液冷服务器集群，这是一个全新的世界。——马兆"
      - "人类敬畏历史，却轻视未来。"
      - "一万五千年后，当太阳系将不复存在，人类的团结与勇气将延续文明的火种。"
