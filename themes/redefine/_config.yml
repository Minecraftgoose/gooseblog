      icon: fa-regular fa-archive
    Tags:
      path: /tags
      text: Tags
      icon: fa-regular fa-tags
    Categories:
      path: /categories
      text: Categories
      icon: fa-regular fa-folder
    Projects:
      path: /projects
      text: Projects
      icon: fa-regular fa-layer-group
    Friends:
      path: /friends
      text: Friends
      icon: fa-regular fa-link
    About:
