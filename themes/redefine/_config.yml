# =====================================================================
# hexo-theme-redefine 站点主题配置 —— GooseBlog 定制版
#
# 原则：
#   1. 视觉用 Redefine 原味（不再要紫色玻璃风）
#   2. 资源全部沿用 Goose 原站：背景图三档 / Logo / 头像 / 钉钉进步体 / prism
#   3. 原 GooseBlog 的功能用「静态化」方式补齐：热力图、分享海报、
#      链接卡片、流浪地球台词打字机、公告、友链、项目页
#
# 与默认值的差异处均带 【Goose】 标记，其余保持 Redefine 出厂设置
# =====================================================================

# BASIC INFORMATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
info:
  title: GooseBlog              # 【Goose】
  subtitle: 网页开发 · 工具折腾 · 偶尔写点有用的东西   # 【Goose】
  author: Goose                 # 【Goose】
  url: https://blog.goose.cc.cd # 【Goose】
# BASIC INFORMATION <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end

# IMAGE CONFIGURATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
defaults:
  favicon: /images/avatar-256.webp   # 【Goose】原站 256 头像当站点图标
  logo: /images/avatar.webp          # 【Goose】导航栏 Logo 用头像（512×512，正好填方形 logo 位）
  avatar: /images/avatar.webp        # 【Goose】原站头像
# IMAGE CONFIGURATION <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end

# COLORS >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
colors:
  # 【Goose】出厂是 #A31F34（深红），按需求全站改紫。
  # #8B5CF6 = violet-500，深浅两套主题下都够亮，hover / 链接 / 按钮 / 强调色全走它。
  primary: "#8B5CF6"
  secondary:
  default_mode: dark        # 【Goose】原站默认深色
# COLORS <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end

# SITE CUSTOMIZATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
global:
  fonts:
    chinese:
      enable: false
      family:
      url:
    english:
      enable: false
      family:
      url:
    title:
      enable: false
      family:
      url:
  content_max_width: 1000px
  sidebar_width: 210px
  hover:
    shadow: true
    scale: false
  scroll_progress:
    bar: true              # 【Goose】原站有阅读进度
    percentage: true
  website_counter:
    url: https://cn.vercount.one/js
    enable: true
    site_pv: true
    site_uv: true
    post_pv: true
  single_page: true        # 【Goose】swup 无刷新切页 ≈ 原站 SPA 体验
  preloader:
    enable: true           # 【Goose】对应原站开屏动画
    custom_message: GooseBlog
  side_tools:
    gear_rotation: true
    auto_expand: false
  open_graph:
    enable: true           # 【Goose】原站服务端注入 OG，这里由主题生成
    image: /images/og-default.jpg
    description: 紫色玻璃风博客 · 网页开发 · 工具折腾 · 偶尔写点有用的东西
  google_analytics:
    enable: false
    id:
# SITE CUSTOMIZATION <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end

