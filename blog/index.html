          <div class="logo">
            <img class="brand-logo" src="/logo.svg" alt="GooseBlog">

            <span class="nav-item-icon"><i class="fas fa-layer-group"></i></span>

        <div class="user-bar">

      <div class="overlay" id="overlay"></div>

      <!-- Main -->
      <main class="main">
        <header class="mobile-header">
          <button class="icon-btn" id="menuBtn">
            <i class="fas fa-bars"></i>

            <i class="fas fa-arrow-left"></i>

          <button class="header-icon-btn" id="mobileForwardBtn" title="前进" disabled>
            <i class="fas fa-arrow-right"></i>
          </button>
          <div class="logo">
            <img class="brand-logo" src="/logo.svg" alt="GooseBlog">
          </div>
          <button class="header-icon-btn" id="mobileThemeBtn" title="切换主题">
            <i class="fas fa-moon"></i>
          </button>
          <button class="header-icon-btn" id="mobileLangBtn" title="English">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

        </header>

        <header class="chat-header">

            <i class="fas fa-bars"></i>
          </button>
          <button class="header-icon-btn" id="headerBackBtn" title="后退" disabled>
            <i class="fas fa-arrow-left"></i>
          </button>
          <button class="header-icon-btn" id="headerForwardBtn" title="前进" disabled>
            <i class="fas fa-arrow-right"></i>
          </button>

            <button class="header-icon-btn" id="headerThemeBtn" title="切换主题">

            </button>
            <button class="header-icon-btn" id="headerLangBtn" title="English">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

        </header>

            <p>加载中...</p>
