# Site
title: GooseBlog
subtitle: 鹅滴博客嘎嘎
description: 鹅滴博客嘎嘎
keywords: 鹅滴博客嘎嘎
author: Goose
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://blog.goose.cc.cd
root: /
permalink: posts/:slug/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "_headers"
  - "_redirects"

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: true
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

marked:
  gfm: true
  pedantic: false
  breaks: true
  smartLists: true
  smartypants: false
  modifyAnchors: ''
  autolink: true
  mangle:
    enable: false
  headerIds: true
  headerPrefix: ''
  prettify: false
  xhtml: false
  sanitizeUrl: false
  headerShift: false

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
use_date_for_updated: false

# Pagination
per_page: 6
pagination_dir: page

# Include / Exclude
include:
  - "_headers"
  - "_redirects"
exclude:
ignore:

# Extensions
theme: redefine

# Deployment
deploy:
  type: ''

# Feed
# 同时输出 Atom + RSS2：
#   atom.xml  → <summary> 摘要 + <content> 全文（很多阅读器只读 summary）
#   rss2.xml  → <description> 摘要 + <content:encoded> 全文（Foxmail 等客户端
#               对 content:encoded 的兼容性更好，正文能正常读出来）
# 两个文件都带全文，订阅哪个都不缺正文。
feed:
  enable: true
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 20
  content: true
  content_limit: 140
  order_by: -date

# Sitemap
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt

# 本地搜索
search:
  path: search.xml
  field: post
  content: true
  format: html
