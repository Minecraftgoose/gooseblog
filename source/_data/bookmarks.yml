# =============================================================
# 书签数据源（对应 /bookmarks 页面）
# 由 Firefox 书签导出文件 bookmarks-2026-10-25.json 转换而来
# =============================================================
#
# 结构：数组 → 每个元素是一个分类
#   category  分类名（左侧导航）
#   icon      图标名。模板里已写死 fa-regular 前缀，
#             这里**只填图标名**，别再写 fa-regular / fa-solid
#   items     该分类下的书签
#     name / link / image / description
#
# ⚠️ 转换时做的三处整理，不满意可自行改：
#   1. 原来嵌在「主机·域名·建站」里的 GooseHost 子文件夹被提到了顶层。
#      主题的模板只支持「分类 → 书签」两级，放不进第三层。
#   2. 散落在根目录下的 1 条书签归到「其他」。
#   3. Firefox 里带 fake-favicon-uri: 前缀的图标抓不到真实地址，
#      统一换成主题自带的占位图，省掉一次必然失败的请求。
#      image 是外链，图挂了浏览器会自动回退到同一张占位图。

