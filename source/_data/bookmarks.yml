# =============================================================
# 书签数据源（对应 /bookmarks 页面）
# 由 Firefox 书签导出文件 bookmarks-2026-10-25.json 转换而来
# =============================================================
#
#   category  分类名（左侧导航）
#   icon      只填图标名，模板已写死 fa-regular 前缀
#   items     name / link / image / description
#
# ⚠️ image 取值优先级：真实 iconUri > 内联 data: URI > 域名 + /favicon.ico
#    Firefox 的 fake-favicon-uri:<url> 前缀后面跟的就是站点 URL，剥掉前缀
#    取域名拼 /favicon.ico；iconUri 为空时同样从 link 取域名拼。
#    个别站点确实没有 /favicon.ico，模板 onerror 会回退占位图，属正常。
#
# ⚠️ 转换时做的整理：
#   1. 嵌在「主机·域名·建站」里的 GooseHost 子文件夹提到顶层
#      （模板只支持「分类 → 书签」两级）
#   2. 散落在根目录的 1 条归入「其他」

