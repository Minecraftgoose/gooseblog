# =============================================================
# 说说数据源（对应 /shuoshuo 页面）
# 文件名三选一：shuoshuo.yml / essays.yml / essay.yml
# 页面按 date 倒序排列，最新的在最上面
# =============================================================
#
# 字段：
#   date     必填。建议写成带引号的字符串，避免 YAML 自行转时区
#   content  必填。走 markdown 渲染，**加粗**、[链接]()、代码块都能用
#
# ⚠️ 中文加粗的老问题在这儿照样适用：
#    **岁月无声。**这种「全角句号 + 后面紧跟汉字」的写法不生效，
#    要写成 **岁月无声**。  —— 站点已挂自动修复脚本，
#    但新写的源文件还是按对的写法来更稳妥。
#
# ⚠️ content 里如果有英文冒号 + 缩进，YAML 会解析失败，
#    多行内容一律用 | 块写法（如下），不要写成单行。

- date: '2026-10-25 15:30:00'
  content: |
    相册、说说、书签三个页面都搭好了。
    内容在 `source/_data/` 下对应的 yml 里，改完重新构建即可。

- date: '2026-10-24 22:10:00'
  content: |
    今天给博客做了一次大扫除：删掉了 Font Awesome 里没人用的 ttf，
    `public/` 瘦了差不多 6 MB。
