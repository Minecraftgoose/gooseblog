name: Deploy GooseBlog (Netlify 备胎)


on:
  push:
    # 和主 workflow 保持一致：main / production → 备胎生产环境
    branches: [main, production, master]
  workflow_dispatch:

# 排队执行，别自己打断自己
concurrency:
  group: deploy-gooseblog-netlify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 和主 workflow 用同一个 Node 版本，避免两份 lockfile 行为不一致
  NODE_VERSION: '22'

  # ⚠️ netlify-cli 别用 latest。19.x 里 --no-build 被移除、deploy 行为也变过，
  #    锁大版本号，出问题好定位
  NETLIFY_CLI_VERSION: '19'

  PRODUCTION_BRANCH: production
  DEPLOY_PROD_ON: main

jobs:
  netlify:
    name: Build & Deploy Netlify Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 备胎部署失败不算流水线失败，主站照常上线
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check required secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=0
          [ -z "$NETLIFY_AUTH_TOKEN" ] && { echo "::error::缺少 Secret: NETLIFY_AUTH_TOKEN"; missing=1; }
          [ -z "$NETLIFY_SITE_ID" ]    && { echo "::error::缺少 Secret: NETLIFY_SITE_ID";    missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::Netlify 备胎尚未配置，本次跳过（不影响 Cloudflare 主站）"
            echo "::error::位置：仓库 Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::未找到 package-lock.json，回退到 npm install"
            npm install --no-audit --no-fund
          fi

      - name: Build Hexo site with mirror url
        env:
          NETLIFY_SITE_URL: ${{ vars.NETLIFY_SITE_URL }}
        run: |
          npx hexo clean
          if [ -n "$NETLIFY_SITE_URL" ]; then
            # 只覆盖 url 一项，其余（主题、插件、permalink）全部沿用主配置
            printf 'url: %s\n' "$NETLIFY_SITE_URL" > _config.netlify.yml
            echo "备胎 url 覆盖为: $NETLIFY_SITE_URL"
            npx hexo generate --config _config.yml,_config.netlify.yml
          else
            echo "::warning::未设置变量 NETLIFY_SITE_URL，备胎沿用主站 url"
            npx hexo generate
          fi
          # 缓存指纹必须在 generate 之后跑：它改的是 public/ 里的产物。
          # 少了这一步，_headers 里 /js/* /css/* 的一年 immutable 会把
          # 后续更新永远挡在老访客的浏览器外面。
          npm run cache-bust

      - name: Ensure platform config files
        run: |
          # _headers / _redirects 必须落在产物根目录。
          # 正常情况 Hexo 已经按 include 复制过来了，这里是兜底，
          # 防止 _config.yml 的 include 被人改掉后两个文件悄悄消失。
          [ -f public/_headers ]   || cp source/_headers   public/_headers
          [ -f public/_redirects ] || cp source/_redirects public/_redirects

      # 链接预览：主站由 Cloudflare Worker 接管 /api/link-preview*，
      # 备胎没 Worker，由 netlify/functions/link-preview.mjs 顶上。
      #
      # ⚠️ 这里**不再**往 _redirects 里追加 rewrite 规则了。
      #    旧方案是追加一条
      #      /api/link-preview  /.netlify/functions/link-preview  200
      #    多一环就多一个故障点：rewrite 和 function 部署只要有一个没生效，
      #    对外路径就是 404，而前端静默降级，页面上只表现为"没图"。
      #    现在函数用自己的 config.path 声明式挂在 /api/link-preview 上，
      #    函数部署成功 == 路径可用，_redirects 保持与主站完全一致。
      #    （反过来说：一旦把 config.path 去掉，就必须把 rewrite 加回来。）
      - name: Verify link-preview function source
        run: |
          f=netlify/functions/link-preview.mjs
          if [ ! -f "$f" ]; then
            echo "::error::缺少 $f"
            exit 1
          fi
          # config.path 是这条链路的命门：没有它，函数只会挂在
          # /.netlify/functions/link-preview 上，而前端请求的是 /api/link-preview。
          if ! grep -q "path: '/api/link-preview'" "$f"; then
            echo "::error::$f 里找不到 config.path = /api/link-preview，抓图会 404"
            exit 1
          fi
          # 主站产物绝不能出现这条 rewrite：Cloudflare 上 /.netlify/ 是不存在的路径。
          if grep -q "netlify/functions" public/_redirects; then
            echo "::error::public/_redirects 里残留 .netlify/functions rewrite，请检查"
            exit 1
          fi
          echo "link-preview 函数源码校验通过（config.path 已声明）"

      - name: "Optional: noindex the mirror"
        env:
          NETLIFY_NOINDEX: ${{ vars.NETLIFY_NOINDEX }}
        run: |
          if [ "$NETLIFY_NOINDEX" = "true" ]; then
            # 在 /* 兜底块里插一行，不覆盖同块已有的安全头
            sed -i 's|^/\*$|/*\n  X-Robots-Tag: noindex, nofollow|' public/_headers
            echo "已给备胎全站加上 X-Robots-Tag: noindex"
          fi

      - name: Verify build output
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::hexo generate 没有产出 public/index.html"
            exit 1
          fi
          echo "产物大小: $(du -sh public | cut -f1)"
          echo "HTML 页数: $(find public -name '*.html' | wc -l)"

      - name: Determine deploy target
        id: target
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "$ref" = "${DEPLOY_PROD_ON}" ] || [ "$ref" = "$PRODUCTION_BRANCH" ]; then
            echo "prod=true" >> "$GITHUB_OUTPUT"
            echo "部署目标：备胎生产环境"
          else
            echo "prod=false" >> "$GITHUB_OUTPUT"
            echo "::warning::分支 $ref 非生产分支，本次只生成 draft 预览 URL"
          fi

      - name: Deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          args=(--dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN")
          # ⚠️ 必须显式带 --functions：
          #    netlify deploy 只是把 --dir 里的静态产物传上去，不会去打包
          #    netlify/functions。少了这个参数，函数文件根本不会上传，
          #    /api/link-preview 直接 404 —— 前端静默降级，页面上只表现为
          #    "卡片没图"。这个失败是静默的：deploy 照样成功、站点照样能开。
          #
          #    ⚠️ 路径写 netlify/functions（相对仓库根），不是 public/... ：
          #    functions 目录也必须在发布目录之外，否则源码会被当静态资源传上去。
          args+=(--functions=netlify/functions)
          # ⚠️ 别让 CLI 复用上一次的打包缓存：缓存里存的是旧函数，
          #    改完函数代码却命中缓存就会deploy 出旧版本，症状是"改了没效果"。
          args+=(--skip-functions-cache)
          args+=(--message="GooseBlog ${GITHUB_REF_NAME}@${GITHUB_SHA::7}")
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            args+=(--prod)
          fi

          out=$(npx --yes netlify-cli@$NETLIFY_CLI_VERSION deploy "${args[@]}" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -o 'https://[^ ]*netlify.app' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 抓图是静默降级的能力：挂了不影响页面打开，只有卡片没图，不主动探
      # 一下根本发现不了。
      #
      # ⚠️ 光看 HTTP 状态码不够。函数返回 200 也可能是 { error: "HTTP 403" }
      #    —— 前端同样判定失败、同样不显示图。所以这里必须把 body 打出来，
      #    并区分三种结果：
      #      404        → 函数压根没部署上去（八成是 --functions 没生效）
      #      200 + error→ 函数活着但抓取失败（超时 / 被目标站拒绝）
      #      200 + 数据 → 正常
      - name: Smoke test link-preview endpoint
        env:
          DEPLOY_URL: ${{ steps.netlify.outputs.url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::warning::没解析出部署 URL，跳过冒烟测试"
            exit 0
          fi

          probe="$DEPLOY_URL/api/link-preview?url=https%3A%2F%2Fexample.com"

          # -D 把响应头单独存文件，body 直接读；分两次 curl 会打到两次冷启动
          code=$(curl -s -D /tmp/hdr.txt -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 "$probe" || echo "000")

          echo "──── link-preview 冒烟测试 ────"
          echo "URL: $probe"
          echo "HTTP: $code"
          echo "响应头 X-Goose-Cache: $(grep -i '^x-goose-cache' /tmp/hdr.txt | tr -d '\r')"
          echo "响应体: $(cat /tmp/body.txt)"
          echo "───────────────────────────────"

          if [ "$code" = "000" ]; then
            echo "::warning::请求失败或超时，函数可能没起来"
            exit 0
          fi
          if [ "$code" = "404" ]; then
            echo "::error::/api/link-preview 返回 404 —— 函数没部署上去。检查 deploy 有没有带 --functions=netlify/functions，以及函数里的 config.path 是否还在"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::/api/link-preview 返回非 200（$code）"
            exit 0
          fi
          # 200 了还要看内容：error 字段存在 = 抓取失败，卡片照样没图
          if grep -q '"error"' /tmp/body.txt; then
            echo "::warning::函数返回 200 但带 error 字段 —— 抓取目标站失败了（超时/403），卡片仍会是空的"
            exit 0
          fi
          echo "✅ link-preview 正常返回了预览数据"

      - name: Summary
        run: |
          {
            echo "### GooseBlog Netlify 备胎部署完成 ✅"
            echo ""
            echo "- 分支: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- 备胎地址: ${{ steps.netlify.outputs.url }}"
            if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
              echo "- 环境: **生产**（--prod）"
            else
              echo "- 环境: ⚠️ **Draft 预览**（未加 --prod）"
            fi
            echo "- 主站: \`blog.goose.cc.cd\`（Cloudflare Pages，未受影响）"
            echo "- Worker: 不在本 workflow 部署，走 deploy.yml"
          } >> "$GITHUB_STEP_SUMMARY"
