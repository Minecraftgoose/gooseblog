name: Deploy Gooseblog

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的多次推送排队执行，不互相打断（避免部署到一半被取消）
concurrency:
  group: deploy-gooseblog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ┌───────────────────────────────────────────────────────────────┐
# │ 仓库 Settings → Secrets and variables → Actions 需要配置 4 个  │
# ├───────────────────────────────────────────────────────────────┤
# │ CLOUDFLARE_API_TOKEN   Cloudflare API Token（Workers/Pages 写）│
# │ CLOUDFLARE_ACCOUNT_ID  Cloudflare Account ID                  │
# │ SUPABASE_URL           Supabase 项目 URL                      │
# │ SUPABASE_ANON_KEY      Supabase anon public key               │
# ├───────────────────────────────────────────────────────────────┤
# │ 可选（强烈建议配）：                                          │
# │ SUPABASE_SERVICE_KEY   service_role key，绕过 RLS 写库        │
# │ ADMIN_PASSWORD         后台密码，不配则回落到默认 'gooseblog' │
# └───────────────────────────────────────────────────────────────┘

env:
  # wrangler CLI 版本（锁定大版本，避免 major 升级直接炸流水线）
  WRANGLER_VERSION: '4'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) 先部署后端 Worker（gooseblog-api）
  #    Pages 通过 service binding (ROOM) 调用它，必须先存在
  # ─────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gooseblog-api/worker/package-lock.json

      - name: Install dependencies
        working-directory: gooseblog-api/worker
        run: npm ci

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          [ -z "$CF_TOKEN" ]   && { echo "::error::缺少 Secret: CLOUDFLARE_API_TOKEN";   missing=1; }
          [ -z "$CF_ACCOUNT" ] && { echo "::error::缺少 Secret: CLOUDFLARE_ACCOUNT_ID";  missing=1; }
          [ -z "$SB_URL" ]     && { echo "::error::缺少 Secret: SUPABASE_URL";            missing=1; }
          [ -z "$SB_KEY" ]     && { echo "::error::缺少 Secret: SUPABASE_ANON_KEY";       missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 中补齐上述 4 个 Secret。"
            exit 1
          fi

      # 把 Supabase 配置写进 Worker 的 Secret 存储（加密保存，不入库、不进日志）
      # 注意：wrangler secret put 自身会触发一次部署，所以放在 deploy 之前
      - name: Sync Worker secrets
        working-directory: gooseblog-api/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 通过 env 传入，避免在 run 里内联展开 secret 造成 shell 注入
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          put_secret() {
            name="$1"
            eval "value=\"\${$name:-}\""
            if [ -z "$value" ]; then
              echo "跳过 $name（未配置）"
              return
            fi
            printf '%s' "$value" | npx --yes wrangler@$WRANGLER_VERSION secret put "$name" >/dev/null
            echo "已写入 secret: $name"
          }
          put_secret SUPABASE_URL
          put_secret SUPABASE_ANON_KEY
          put_secret SUPABASE_SERVICE_KEY
          put_secret ADMIN_PASSWORD

      - name: Deploy Worker
        working-directory: gooseblog-api/worker
        run: npx --yes wrangler@$WRANGLER_VERSION deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─────────────────────────────────────────────────────────────
  # 2) 再部署前端 Pages（blog/ 即构建产物目录，无需打包）
  # ─────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        working-directory: blog
        run: |
          npx --yes wrangler@$WRANGLER_VERSION pages deploy . \
            --project-name gooseblog \
            --branch "${GITHUB_REF_NAME}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          {
            echo "### GooseBlog 部署完成 ✅"
            echo ""
            echo "- 分支: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Pages 项目: \`gooseblog\`"
            echo "- API Worker: \`gooseblog-api\`"
          } >> "$GITHUB_STEP_SUMMARY"
