name: Deploy GooseBlog (Hexo)

on:
  push:
    # main / production → 生产环境（更新 blog.goose.cc.cd）
    # 其他分支 → Preview
    branches: [main, production, master]
  workflow_dispatch:

# 同一分支的多次推送排队执行，不互相打断（避免部署到一半被取消）
concurrency:
  group: deploy-gooseblog-hexo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ┌───────────────────────────────────────────────────────────────┐
# │ 本流水线已剔除后端：不再部署 gooseblog-api Worker，             │
# │ 也不需要 SUPABASE_* / ADMIN_PASSWORD 这些 Secret。             │
# │ 只需 2 个 Secret：                                             │
# │   CLOUDFLARE_API_TOKEN   Cloudflare API Token（Pages 写权限）  │
# │   CLOUDFLARE_ACCOUNT_ID  Cloudflare Account ID                │
# └───────────────────────────────────────────────────────────────┘

env:
  # wrangler CLI 版本（锁定大版本，避免 major 升级直接炸流水线）
  WRANGLER_VERSION: '4'
  NODE_VERSION: '20'

  # ⚠️ 必须与 Cloudflare Pages 项目里设置的「Production branch」完全一致
  PRODUCTION_BRANCH: production

  # 触发生产部署的推送分支
  DEPLOY_PROD_ON: main

jobs:
  build:
    name: Build & Deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 主题以完整源码放在 themes/redefine，不需要拉子模块，无需 submodules
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # hexo 8.1.2 要求 node >= 20.19.0
          node-version: ${{ env.NODE_VERSION }}
          # 需要 package-lock.json 才能命中缓存；仓库里已提交该文件
          cache: npm

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -z "$CF_TOKEN" ]   && { echo "::error::缺少 Secret: CLOUDFLARE_API_TOKEN";   missing=1; }
          [ -z "$CF_ACCOUNT" ] && { echo "::error::缺少 Secret: CLOUDFLARE_ACCOUNT_ID";  missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 中补齐上述 Secret。"
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::未找到 package-lock.json，回退到 npm install"
            npm install --no-audit --no-fund
          fi

      - name: Build Hexo site
        run: npm run build
        env:
          # 导出旧文章用（可选）：配了才会跑，不配也不影响构建
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Verify build output
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::hexo generate 没有产出 public/index.html，构建异常"
            exit 1
          fi
          echo "产物大小: $(du -sh public | cut -f1)"
          echo "HTML 页数: $(find public -name '*.html' | wc -l)"

      - name: Determine deploy target
        id: target
        run: |
          ref="${GITHUB_REF_NAME}"
          prod="${PRODUCTION_BRANCH}"
          if [ "$ref" = "${DEPLOY_PROD_ON}" ] || [ "$ref" = "$prod" ]; then
            echo "branch=$prod" >> "$GITHUB_OUTPUT"
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "部署目标：生产环境（推送分支 $ref → --branch $prod）"
          else
            echo "branch=$ref" >> "$GITHUB_OUTPUT"
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "::warning::分支 $ref 不在生产触发列表（${DEPLOY_PROD_ON} / ${prod}），本次为 Preview 部署，自定义域名不会更新。"
          fi

      # public/ 就是 hexo generate 的产物目录
      # 静态站不再需要 Pages Functions，头信息改由 public/_headers 提供
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@$WRANGLER_VERSION pages deploy public \
            --project-name gooseblog \
            --branch "${{ steps.target.outputs.branch }}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: |
          {
            echo "### GooseBlog 部署完成 ✅"
            echo ""
            echo "- 分支: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Pages 项目: \`gooseblog\`"
            echo "- 构建: \`hexo generate\` → \`public/\`"
            echo "- 后端: 无（已剔除 Worker API）"
            if [ "${{ steps.target.outputs.is_production }}" = "true" ]; then
              echo "- 环境: **生产**（自定义域名已更新）"
            else
              echo "- 环境: ⚠️ **Preview**（生产分支为 \`${PRODUCTION_BRANCH}\`）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
