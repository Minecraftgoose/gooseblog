# GooseBlog — Worker 配置
# 后端 API Worker，处理所有数据逻辑，通过 service binding 被 Pages Function 调用。
#
# 环境变量（Secrets）：
#   SUPABASE_URL      — Supabase 项目 URL
#   SUPABASE_ANON_KEY — Supabase anon public key
#
# 部署：
#   wrangler deploy

name = "gooseblog-api"
main = "index.js"
compatibility_date = "2026-07-17"
nodejs_compat = true

# 没有 Durable Object 需求，纯 HTTP Worker
